name: Update Native SDK Dependency

on:
  repository_dispatch:
    types: [android-sdk-release, ios-sdk-release]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false

      - name: Extract platform and version
        id: info
        env:
          VERSION: ${{ github.event.client_payload.version }}
          EVENT_TYPE: ${{ github.event.action }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid version"; exit 1; }
          if [ "$EVENT_TYPE" = "android-sdk-release" ]; then
            PLATFORM="android"
          else
            PLATFORM="ios"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Update Android dependency
        if: steps.info.outputs.PLATFORM == 'android'
        env:
          VERSION: ${{ steps.info.outputs.VERSION }}
        run: |
          sed -i "s/implementation 'com.setgreet:setgreet:[^']*'/implementation 'com.setgreet:setgreet:$VERSION'/" android/build.gradle

      - name: Update iOS dependency
        if: steps.info.outputs.PLATFORM == 'ios'
        env:
          VERSION: ${{ steps.info.outputs.VERSION }}
        run: |
          # Swift Package Manager path: the exact version Package.swift resolves.
          sed -i -E "/setgreet-ios-sdk\.git/ s/exact: \"[^\"]*\"/exact: \"$VERSION\"/" ios/setgreet/Package.swift
          grep -q "exact: \"$VERSION\"" ios/setgreet/Package.swift || { echo "::error::Package.swift pin not updated"; exit 1; }

          # CocoaPods path: refresh the vendored xcframeworks from the same tag.
          git clone --depth 1 --branch "$VERSION" https://github.com/setgreet/setgreet-ios-sdk.git /tmp/setgreet-ios-sdk
          rm -rf ios/Frameworks/SetgreetSDK.xcframework ios/Frameworks/SetgreetSDKLottie.xcframework
          mkdir -p ios/Frameworks
          git -C /tmp/setgreet-ios-sdk archive HEAD SetgreetSDK.xcframework SetgreetSDKLottie.xcframework | tar -x -C ios/Frameworks
          test -f ios/Frameworks/SetgreetSDK.xcframework/Info.plist || { echo "::error::SetgreetSDK.xcframework missing"; exit 1; }
          test -f ios/Frameworks/SetgreetSDKLottie.xcframework/Info.plist || { echo "::error::SetgreetSDKLottie.xcframework missing"; exit 1; }
          rm -rf /tmp/setgreet-ios-sdk

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.SDK_RELEASE_PAT }}
          base: develop
          branch: chore/update-${{ steps.info.outputs.PLATFORM }}-sdk-${{ steps.info.outputs.VERSION }}
          commit-message: "chore: update ${{ steps.info.outputs.PLATFORM }} native SDK to ${{ steps.info.outputs.VERSION }}"
          title: "chore: update ${{ steps.info.outputs.PLATFORM }} native SDK to ${{ steps.info.outputs.VERSION }}"
          body: |
            Automated update of ${{ steps.info.outputs.PLATFORM }} native SDK dependency to version `${{ steps.info.outputs.VERSION }}`.

            Triggered by a new release in the source SDK repository.

            > Review whether Dart/platform channel code changes are needed for new native APIs before merging.
