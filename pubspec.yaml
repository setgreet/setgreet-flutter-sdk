name: setgreet
description: Official Flutter SDK for Setgreet - Mobile app user onboarding and engagement platform
version: 1.7.0
homepage: https://setgreet.com
repository: https://github.com/setgreet/setgreet-flutter-sdk
issue_tracker: https://github.com/setgreet/setgreet-flutter-sdk/issues

environment:
  # The real Dart floor is 3.6 (Flutter 3.27 below); 3.0 here keeps the
  # package's language version, so raising it is a language change.
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.setgreet.flutter
        pluginClass: SetgreetPlugin
      ios:
        pluginClass: SetgreetPlugin

topics:
  - setgreet
  - flutter
  - sdk
  - mobile-app
  - onboarding
